services:
  mariadb:
    container_name: IT-Assets-MariaDB-Test
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: it_assets
      MARIADB_USER: it_assets
      MARIADB_PASSWORD: change-me
      MARIADB_ROOT_PASSWORD: change-me-root
    volumes:
      - /opt/docker/data/it-assets-tracker-test/mariadb:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  it-assets:
    container_name: IT-Assets-Tracker-Test
    build:
      context: /opt/docker/apps/it-assets-tracker
      dockerfile: docker/Dockerfile
      args:
        DB_MODE: local
        DB_PROVIDER: mariadb
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${IT_ASSETS_TEST_HOST_PORT:-4051}:4050"
    environment:
      PORT: 4050
      APP_URL: ${APP_URL:-http://localhost:4051}
      SESSION_SECRET: change-me
      SESSION_COOKIE_SECURE: auto
      DB_MODE: local
      DB_PROVIDER: mariadb
      DATABASE_URL: mysql://it_assets:change-me@mariadb:3306/it_assets
      APP_DATA_DIR: /data
    volumes:
      - /opt/docker/data/it-assets-tracker-test/app:/data
    restart: unless-stopped
