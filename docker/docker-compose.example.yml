services:
  it-assets:
    container_name: IT-Assets
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4050:4050"
    environment:
      PORT: 4050
      # Use the externally reachable app URL here. Do not use the internal Docker container hostname.
      APP_URL: http://your-hostname-or-ip:4050
      SESSION_SECRET: change-me
      DATABASE_URL: file:/data/db/app.db
      APP_DATA_DIR: /data
    volumes:
      - ../data:/data
