services:
  it-assets:
    container_name: IT-Assets
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4050:4050"
    environment:
      PORT: 4050
      APP_URL: http://localhost:4050
      SESSION_SECRET: change-me
      DATABASE_URL: file:/data/db/app.db
      APP_DATA_DIR: /data
    volumes:
      - ../data:/data
